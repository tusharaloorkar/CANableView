[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canableview"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6", "python-can[gs_usb,serial]"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-m 'not slow'"
markers = ["slow: long-running stress tests (run with -m slow)"]
